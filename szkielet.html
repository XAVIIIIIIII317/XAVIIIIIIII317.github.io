<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Osteon — Atlas Szkieletu</title>
<meta name="description" content="Interaktywny atlas układu szkieletowego człowieka — kliknij dowolną kość, aby poznać jej budowę, funkcję i ciekawostki.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06080e; --bg2:#0b1020;
  --panel:rgba(255,255,255,.035); --panel-solid:#0e1322; --border:rgba(255,255,255,.08); --border-strong:rgba(255,255,255,.16);
  --text:#ece8df; --muted:#8e93a4; --faint:#5d6274;
  --accent:#5eead4; --accent-2:#22d3ee; --accent-ink:#04201c; --accent-soft:rgba(94,234,212,.12);
  --b1:#f8f2e4; --b2:#e3d6bb; --b3:#b4a282; --bs:#7a6b52; --hole:#070a12; --shade:rgba(80,62,30,.18); --cart:#9fb6c9;
  --ok:#4ade80; --bad:#fb7185; --hint:#fbbf24;
  --r-glowa:#f0abfc; --r-kregoslup:#fcd34d; --r-klatka:#fda4af; --r-gorna:#93c5fd; --r-dolna:#86efac;
  --shadow:0 30px 80px -30px rgba(0,0,0,.7);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f3efe6; --bg2:#ebe5d8;
  --panel:rgba(255,255,255,.62); --panel-solid:#fbf9f4; --border:rgba(40,30,10,.09); --border-strong:rgba(40,30,10,.18);
  --text:#1b1d24; --muted:#6a6c78; --faint:#9a9aa4;
  --accent:#0d9488; --accent-2:#0891b2; --accent-ink:#ffffff; --accent-soft:rgba(13,148,136,.1);
  --b1:#fffaf0; --b2:#eadfc6; --b3:#c4ae86; --bs:#86714b; --hole:#4b3f2c; --shade:rgba(120,90,40,.14); --cart:#8ea6ba;
  --ok:#16a34a; --bad:#e11d48; --hint:#d97706;
  --r-glowa:#d946ef; --r-kregoslup:#f59e0b; --r-klatka:#f43f5e; --r-gorna:#3b82f6; --r-dolna:#22c55e;
  --shadow:0 30px 70px -35px rgba(60,40,10,.35);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:
    radial-gradient(1200px 700px at 12% -10%, rgba(94,234,212,.09), transparent 60%),
    radial-gradient(900px 700px at 105% 110%, rgba(167,139,250,.08), transparent 60%),
    var(--bg);
  color:var(--text); font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif; font-size:14px; line-height:1.55;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
:root[data-theme="light"] body{
  background:
    radial-gradient(1200px 700px at 12% -10%, rgba(13,148,136,.08), transparent 60%),
    radial-gradient(900px 700px at 105% 110%, rgba(217,119,6,.07), transparent 60%),
    var(--bg);
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.serif{font-family:Fraunces,Georgia,serif}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:300px minmax(0,1fr) 380px;grid-template-rows:auto minmax(0,1fr);height:100vh;gap:14px;padding:14px}
header{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:6px 8px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(140deg,var(--accent),var(--accent-2));color:var(--accent-ink);box-shadow:0 8px 30px -8px var(--accent)}
.brand h1{margin:0;font-family:Fraunces,serif;font-weight:600;font-size:22px;letter-spacing:-.01em;line-height:1}
.brand p{margin:3px 0 0;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.seg{display:flex;padding:4px;border-radius:999px;background:var(--panel);border:1px solid var(--border);backdrop-filter:blur(14px)}
.seg button{padding:7px 16px;border-radius:999px;font-weight:500;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:7px;transition:.25s}
.seg button.on{background:var(--text);color:var(--bg);box-shadow:0 4px 16px -6px rgba(0,0,0,.5)}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--border);color:var(--text);transition:.2s;backdrop-filter:blur(14px)}
.icon-btn:hover{border-color:var(--border-strong);transform:translateY(-1px)}
.icon-btn svg,.seg svg{width:17px;height:17px}

.panel{background:var(--panel);border:1px solid var(--border);border-radius:22px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:var(--shadow);min-height:0;display:flex;flex-direction:column;overflow:hidden}

/* ---------- Left: index ---------- */
.index-head{padding:18px 18px 12px}
.big-stat{display:flex;align-items:baseline;gap:10px}
.big-stat b{font-family:Fraunces,serif;font-size:44px;font-weight:600;line-height:1;letter-spacing:-.02em;background:linear-gradient(120deg,var(--text),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.big-stat span{color:var(--muted);font-size:12.5px;line-height:1.3}
.search{margin-top:14px;position:relative}
.search input{width:100%;padding:11px 14px 11px 38px;border-radius:14px;border:1px solid var(--border);background:rgba(127,127,127,.06);color:var(--text);font:inherit;outline:none;transition:.2s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:500 11px Inter;color:var(--faint);border:1px solid var(--border);border-radius:6px;padding:1px 6px}
.list{overflow:auto;padding:4px 10px 16px;flex:1;scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent}
.region{margin-top:10px}
.region-h{display:flex;align-items:center;gap:9px;padding:8px 8px 6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;border-radius:10px;cursor:default}
.region-h i{width:8px;height:8px;border-radius:50%;background:var(--rc);box-shadow:0 0 12px var(--rc)}
.region-h em{margin-left:auto;font-style:normal;letter-spacing:0;font-weight:500;color:var(--faint);text-transform:none}
.item{width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;text-align:left;transition:background .2s,transform .2s}
.item:hover{background:rgba(127,127,127,.08)}
.item.on{background:var(--accent-soft);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 45%,transparent)}
.item .nm{flex:1;min-width:0}
.item .nm b{display:block;font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .nm small{display:block;color:var(--faint);font-size:11.5px;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .ct{font-size:11.5px;color:var(--muted);background:rgba(127,127,127,.1);border-radius:999px;padding:2px 8px;font-variant-numeric:tabular-nums}
.item.on .ct{background:var(--accent);color:var(--accent-ink)}
.note{margin:14px 8px 0;font-size:11.5px;color:var(--faint);line-height:1.5}
.empty-search{padding:24px 10px;color:var(--muted);text-align:center}
.quiz-on .list,.quiz-on .search{opacity:.35;pointer-events:none;filter:blur(1.5px)}

/* ---------- Stage ---------- */
.stage{position:relative;padding:0;overflow:hidden;
  background:
    radial-gradient(closest-side at 50% 46%, rgba(94,234,212,.07), transparent 85%),
    radial-gradient(rgba(127,127,127,.16) 1px, transparent 1.3px) 0 0/22px 22px,
    var(--panel);
}
:root[data-theme="light"] .stage{background:radial-gradient(closest-side at 50% 46%, rgba(255,255,255,.9), transparent 85%),radial-gradient(rgba(60,40,10,.12) 1px, transparent 1.3px) 0 0/22px 22px,var(--panel)}
#sk{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#sk.dragging{cursor:grabbing}
.toolbar{position:absolute;top:14px;right:14px;display:flex;gap:8px;z-index:3}
.chip{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:999px;background:var(--panel-solid);border:1px solid var(--border);font-size:12.5px;font-weight:500;color:var(--muted);transition:.2s;box-shadow:0 6px 20px -10px rgba(0,0,0,.5)}
.chip:hover{color:var(--text);border-color:var(--border-strong)}
.chip.on{color:var(--text);border-color:color-mix(in srgb,var(--accent) 60%,transparent);background:color-mix(in srgb,var(--accent) 14%,var(--panel-solid))}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--faint);transition:.2s}
.chip.on .dot{background:var(--accent);box-shadow:0 0 10px var(--accent)}
.chip svg{width:15px;height:15px}
.hint-top{position:absolute;bottom:20px;left:18px;transition:opacity .3s;font-size:12px;color:var(--faint);z-index:2;display:flex;align-items:center;gap:8px;pointer-events:none}
.hint-top .pulse{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 var(--accent);animation:ping 2.2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 70%,transparent)}80%,100%{box-shadow:0 0 0 10px transparent}}
.zoom{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px;z-index:3}
.zoom .icon-btn{background:var(--panel-solid)}
.orient{position:absolute;top:50%;font-size:10px;letter-spacing:.35em;color:var(--faint);writing-mode:vertical-rl;transform:translateY(-50%) rotate(180deg);pointer-events:none;z-index:1;font-weight:600}
.orient.l{left:12px}.orient.r{right:12px;transform:translateY(-50%)}
.legend{position:absolute;left:14px;bottom:14px;display:flex;flex-wrap:wrap;gap:6px 12px;max-width:calc(100% - 90px);padding:9px 12px;border-radius:14px;background:var(--panel-solid);border:1px solid var(--border);font-size:11.5px;color:var(--muted);z-index:3;opacity:0;transform:translateY(8px);pointer-events:none;transition:.3s}
.legend.show{opacity:1;transform:none;pointer-events:auto}
.stage:has(.selpill.show) .hint-top,.has-legend .hint-top,.quiz-on .hint-top{opacity:0}
.quiz-on .toolbar{opacity:0;pointer-events:none}
.toolbar{transition:opacity .3s}
@media (max-width:1240px){.hint-top{display:none}}
.legend span{display:flex;align-items:center;gap:6px;cursor:pointer}
.legend i{width:9px;height:9px;border-radius:3px;background:var(--rc)}
.selpill{position:absolute;left:50%;bottom:18px;transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:3;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px;border-radius:999px;background:var(--panel-solid);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);box-shadow:0 12px 40px -12px rgba(0,0,0,.6),0 0 30px -12px var(--accent);transition:.35s cubic-bezier(.2,.8,.2,1);white-space:nowrap;max-width:calc(100% - 140px)}
.selpill.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.selpill b{font-family:Fraunces,serif;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis}
.selpill small{flex:none;color:var(--muted);font-style:italic;font-size:12px;overflow:hidden;text-overflow:ellipsis}
.selpill button{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(127,127,127,.12);flex:none}
.selpill button svg{width:14px;height:14px}
.tip{position:absolute;z-index:5;pointer-events:none;padding:8px 12px;border-radius:12px;background:var(--panel-solid);border:1px solid var(--border-strong);box-shadow:0 10px 30px -10px rgba(0,0,0,.6);opacity:0;transform:translateY(4px) scale(.97);transition:opacity .15s,transform .15s;white-space:nowrap}
.tip.show{opacity:1;transform:none}
.tip b{display:block;font-weight:600;font-size:13px}
.tip small{color:var(--muted);font-style:italic;font-size:11.5px}

/* ---------- SVG bone styles ---------- */
.bone{cursor:pointer;transition:opacity .35s ease}
.bone .s{fill:url(#gBone);stroke:var(--bs);stroke-width:.65;stroke-linejoin:round;transition:fill .25s,stroke .25s}
.bone .eo{fill-rule:evenodd}
.bone .hole{fill:var(--hole);opacity:.82;pointer-events:none}
.bone .line{fill:none;stroke:var(--bs);stroke-width:.55;opacity:.55;pointer-events:none}
.bone .shade{fill:var(--shade);pointer-events:none}
.bone .ro{fill:none;stroke:var(--bs);stroke-linecap:round;transition:stroke .25s}
.bone .r{fill:none;stroke:var(--b2);stroke-linecap:round;transition:stroke .25s}
.bone .post{opacity:.5}
.bone .hit{fill:none;stroke:transparent;stroke-width:9;stroke-linecap:round}
.cart{pointer-events:none}
.cart path{fill:none;stroke:var(--cart);stroke-width:3.4;stroke-linecap:round;opacity:.42}
.has-sel .bone:not(.sel):not(.hover){opacity:.42}
.bone.dim{opacity:.13!important}
.bone.hover .s{fill:url(#gHover);stroke:var(--accent)}
.bone.hover .r{stroke:var(--b1)}.bone.hover .ro{stroke:var(--accent)}
.bone.sel{filter:url(#glow)}
.bone.sel .s{fill:url(#gSel);stroke:color-mix(in srgb,var(--accent) 70%,#000)}
.bone.sel .r{stroke:var(--accent)}.bone.sel .ro{stroke:color-mix(in srgb,var(--accent) 60%,#000)}
.bone.sel .hole{fill:color-mix(in srgb,var(--accent) 35%,#000)}
.colorize .bone[data-region="glowa"] .s{fill:url(#gR-glowa)}
.colorize .bone[data-region="kregoslup"] .s{fill:url(#gR-kregoslup)}
.colorize .bone[data-region="klatka"] .s{fill:url(#gR-klatka)}
.colorize .bone[data-region="gorna"] .s{fill:url(#gR-gorna)}
.colorize .bone[data-region="dolna"] .s{fill:url(#gR-dolna)}
.colorize .bone[data-region="klatka"] .r{stroke:var(--r-klatka)}
.colorize .bone.sel .s{fill:url(#gSel)}
.colorize .bone.hover .s{fill:url(#gHover)}
.bone.ok .s{fill:url(#gOk)!important}.bone.ok .r{stroke:var(--ok)!important}
.bone.bad .s{fill:url(#gBad)!important}.bone.bad .r{stroke:var(--bad)!important}
.bone.hint .s{fill:url(#gHint)!important;animation:blink .5s ease-in-out 3 alternate}.bone.hint .r{stroke:var(--hint)!important}
.bone.ok,.bone.bad,.bone.hint{opacity:1!important}
@keyframes blink{to{opacity:.35}}
.intro .bone{animation:rise .9s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:var(--d,0ms)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.scan{pointer-events:none;animation:scan 2.2s cubic-bezier(.4,0,.2,1) .2s both}
@keyframes scan{from{transform:translateY(-120px);opacity:0}15%{opacity:1}to{transform:translateY(1080px);opacity:0}}

/* ---------- Right: details ---------- */
.detail{overflow:auto;scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent}
.d-inner{padding:24px 24px 22px;animation:fadeUp .45s cubic-bezier(.2,.8,.2,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}}
.badge{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--rc);background:color-mix(in srgb,var(--rc) 12%,transparent);border:1px solid color-mix(in srgb,var(--rc) 30%,transparent)}
.badge i{width:6px;height:6px;border-radius:50%;background:var(--rc)}
.d-title{font-family:Fraunces,serif;font-size:36px;font-weight:600;line-height:1.05;letter-spacing:-.02em;margin:16px 0 6px}
.d-latin{font-family:Fraunces,serif;font-style:italic;color:var(--muted);font-size:17px;margin:0}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:22px 0 4px}
.meta div{padding:12px 14px;border-radius:14px;background:rgba(127,127,127,.06);border:1px solid var(--border)}
.meta small{display:block;color:var(--faint);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.meta b{display:block;font-weight:500;font-size:13.5px;margin-top:3px}
.d-sec{margin-top:22px}
.d-sec h3{margin:0 0 8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:600}
.d-sec p{margin:0;color:color-mix(in srgb,var(--text) 86%,var(--muted));font-size:14.5px;line-height:1.7}
.fact{margin-top:22px;padding:16px 18px;border-radius:16px;position:relative;overflow:hidden;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 13%,transparent),color-mix(in srgb,var(--accent-2) 5%,transparent));border:1px solid color-mix(in srgb,var(--accent) 25%,transparent)}
.fact h3{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
.fact h3 svg{width:15px;height:15px}
.fact p{margin:0;font-size:14px;line-height:1.65}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.link{padding:6px 12px;border-radius:999px;font-size:12.5px;border:1px solid var(--border-strong);transition:.2s;display:flex;align-items:center;gap:6px}
.link i{width:6px;height:6px;border-radius:50%;background:var(--rc)}
.link:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.navrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:26px}
.navrow button{padding:11px 14px;border-radius:14px;border:1px solid var(--border);text-align:left;transition:.2s;min-width:0}
.navrow button:hover{border-color:var(--border-strong);background:rgba(127,127,127,.06)}
.navrow button:last-child{text-align:right}
.navrow small{display:block;color:var(--faint);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.navrow b{display:block;font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.welcome{padding:28px 26px;animation:fadeUp .5s ease}
.welcome .glyph{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);margin-bottom:20px;border:1px solid color-mix(in srgb,var(--accent) 25%,transparent)}
.welcome h2{font-family:Fraunces,serif;font-weight:600;font-size:30px;line-height:1.1;letter-spacing:-.02em;margin:0 0 10px}
.welcome p{color:var(--muted);margin:0 0 18px;font-size:14.5px;line-height:1.7}
.steps{display:grid;gap:10px;margin:22px 0}
.steps div{display:flex;gap:12px;align-items:flex-start;font-size:13.5px;color:var(--muted)}
.steps b{flex:none;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:rgba(127,127,127,.1);color:var(--text);font-size:12px}
.steps kbd{font:500 11px Inter;border:1px solid var(--border-strong);border-radius:5px;padding:0 5px;color:var(--text)}
.cta{display:inline-flex;align-items:center;gap:9px;padding:12px 18px;border-radius:14px;font-weight:600;font-size:13.5px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink);box-shadow:0 10px 30px -10px var(--accent);transition:.2s}
.cta:hover{transform:translateY(-2px);box-shadow:0 14px 34px -10px var(--accent)}
.cta.ghost{background:transparent;color:var(--text);border:1px solid var(--border-strong);box-shadow:none}
.cta svg{width:16px;height:16px}
.ctas{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Quiz ---------- */
.qcard{position:absolute;top:14px;left:50%;transform:translate(-50%,-20px);opacity:0;pointer-events:none;z-index:4;width:min(440px,calc(100% - 28px));padding:14px 16px 12px;border-radius:18px;background:var(--panel-solid);border:1px solid var(--border-strong);box-shadow:0 20px 50px -20px rgba(0,0,0,.7);transition:.4s cubic-bezier(.2,.8,.2,1)}
.qcard.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.qrow{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.qrow .sc{margin-left:auto;display:flex;gap:12px;text-transform:none;letter-spacing:0}
.qrow .sc b{color:var(--text)}
.qtarget{font-family:Fraunces,serif;font-size:24px;font-weight:600;margin:6px 0 10px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.qtarget span{color:var(--muted);font-size:16px;font-weight:400;font-style:italic}
.qbar{height:4px;border-radius:4px;background:rgba(127,127,127,.15);overflow:hidden}
.qbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .5s}
.qfeed{position:absolute;right:16px;top:44px;font-size:13px;font-weight:600}
.qskip{font-size:12px;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:500;padding:2px 8px;border-radius:8px;border:1px solid var(--border)}
.qskip:hover{color:var(--text)}
.modal{position:absolute;inset:0;z-index:6;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 55%,transparent);backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:.35s}
.modal.show{opacity:1;pointer-events:auto}
.mbox{width:min(380px,calc(100% - 32px));padding:28px;border-radius:24px;background:var(--panel-solid);border:1px solid var(--border-strong);text-align:center;box-shadow:var(--shadow);transform:scale(.95);transition:.35s}
.modal.show .mbox{transform:none}
.ring{width:150px;height:150px;margin:0 auto 14px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:Fraunces,serif;font-size:40px;font-weight:600}
.ring b small{display:block;font-size:13px;color:var(--muted);font-family:Inter;font-weight:500;margin-top:-30px}
.mbox h2{font-family:Fraunces,serif;margin:0 0 6px;font-size:24px}
.mbox p{color:var(--muted);margin:0 0 20px}
.mbox .ctas{justify-content:center}
.qinfo{padding:28px 26px}
.qinfo h2{font-family:Fraunces,serif;font-size:28px;margin:0 0 8px;letter-spacing:-.02em}
.qinfo p{color:var(--muted);margin:0 0 16px;line-height:1.7}
.qstats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0}
.qstats div{padding:14px;border-radius:14px;border:1px solid var(--border);background:rgba(127,127,127,.06)}
.qstats b{display:block;font-family:Fraunces,serif;font-size:28px;font-weight:600}
.qstats small{color:var(--faint);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.verdict{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;margin-bottom:18px;font-weight:600;font-size:13.5px}
.verdict.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 35%,transparent)}
.verdict.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent)}
.verdict svg{width:18px;height:18px;flex:none}

/* ---------- Responsive ---------- */
@media (max-width:1180px){.app{grid-template-columns:260px minmax(0,1fr) 340px}.d-title{font-size:30px}}
@media (max-width:920px){
  body{overflow:auto}
  .app{display:flex;flex-direction:column;height:auto;min-height:100vh;padding:10px 16px 24px;gap:12px}
  header{padding:4px 0;flex-wrap:wrap}
  .brand p{display:none}
  .stage{height:78vh;min-height:520px;order:1}
  .detail{order:2;overflow:visible}
  .index{order:3;max-height:none}
  .list{overflow:visible}
  .hint-top{display:none}
  .toolbar{left:12px;right:auto;top:12px}
  .qcard.show~.toolbar,.quiz-on .toolbar{opacity:0;pointer-events:none}
  .orient{display:none}
  .seg button{padding:7px 12px}
  .seg button span{display:none}
  .d-inner,.welcome,.qinfo{padding:22px 18px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

  <header>

        <h1>Osteon</h1>
        <p>Interaktywny atlas układu szkieletowego człowieka</p>

        <input id="q" type="search" placeholder="Szukaj kości…" autocomplete="off" aria-label="Szukaj kości">

      <button class="chip" id="tColor"><span class="dot"></span>Regiony</button>

    </div>
    <div class="orient l" title="Widok z przodu: prawa strona ciała jest po lewej">STRONA PRAWA</div>
    <div class="orient r">STRONA LEWA</div>

    <svg id="sk" viewBox="0 -10 400 1050" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Szkielet człowieka – widok z przodu">
      <defs>
        <linearGradient id="gBone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--b1)"/><stop offset=".55" style="stop-color:var(--b2)"/><stop offset="1" style="stop-color:var(--b3)"/></linearGradient>
        <linearGradient id="gHover" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" style="stop-color:var(--b1)"/><stop offset="1" style="stop-color:var(--b2)"/></linearGradient>
        <linearGradient id="gSel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0fdfa"/><stop offset=".45" style="stop-color:var(--accent)"/><stop offset="1" style="stop-color:var(--accent-2)"/></linearGradient>
        <linearGradient id="gOk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dcfce7"/><stop offset="1" style="stop-color:var(--ok)"/></linearGradient>
        <linearGradient id="gBad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe4e6"/><stop offset="1" style="stop-color:var(--bad)"/></linearGradient>
        <linearGradient id="gHint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fef3c7"/><stop offset="1" style="stop-color:var(--hint)"/></linearGradient>
        <linearGradient id="gScan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent)" stop-opacity="0"/><stop offset=".9" style="stop-color:var(--accent)" stop-opacity=".18"/><stop offset="1" style="stop-color:var(--accent)" stop-opacity=".7"/></linearGradient>
        <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="3.2" result="b"/>
          <feFlood style="flood-color:var(--accent)" flood-opacity=".75"/>
          <feComposite in2="b" operator="in" result="g"/>
          <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="drop" x="-10%" y="-10%" width="120%" height="120%">
          <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity=".35"/>
        </filter>
      </defs>
      <g id="vp">
        <ellipse cx="200" cy="1006" rx="90" ry="9" fill="#000" opacity=".22"/>
        <g id="bones" filter="url(#drop)"></g>
        <rect class="scan" x="0" y="-110" width="400" height="110" fill="url(#gScan)"/>
      </g>
    </svg>

    <div class="tip" id="tip"><b></b><small></small></div>
    <div class="legend" id="legend"></div>
    <div class="selpill" id="selpill"><b></b><small></small><button id="pillX" aria-label="Wyczyść wybór"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="zoom">
      <button class="icon-btn" id="zIn" aria-label="Przybliż"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="icon-btn" id="zOut" aria-label="Oddal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
      <button class="icon-btn" id="zReset" aria-label="Pokaż całość"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V5a1 1 0 0 1 1-1h4M20 9V5a1 1 0 0 0-1-1h-4M4 15v4a1 1 0 0 0 1 1h4M20 15v4a1 1 0 0 1-1 1h-4"/></svg></button>

      <div class="qtarget"><span>Wskaż:</span><b id="qname">—</b></div>
      <div class="qbar"><i id="qbar"></i></div>
    </div>
    <div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
  </section>

  <aside class="panel detail" id="detail"></aside>

<script>
(() => {
'use strict';
/* =========================================================
   DANE — kości, regiony
   ========================================================= */
const REGIONS = [
  {id:'glowa',     name:'Czaszka'},
  {id:'kregoslup', name:'Kręgosłup'},
  {id:'klatka',    name:'Klatka piersiowa'},
  {id:'gorna',     name:'Kończyna górna'},
  {id:'dolna',     name:'Kończyna dolna'},
];
const RNAME = Object.fromEntries(REGIONS.map(r => [r.id, r.name]));

const BONES = {
  'czaszka': {name:'Czaszka', latin:'Cranium', region:'glowa', type:'Płaskie i nieregularne', n:21, count:'21 kości', paired:false,
    desc:'Kostny pancerz mózgu i rusztowanie twarzy. Składa się z mózgoczaszki (8 kości: czołowa, dwie ciemieniowe, dwie skroniowe, potyliczna, klinowa i sitowa) oraz trzewioczaszki, która tworzy oczodoły, jamę nosową i szczękę. Kości mózgoczaszki łączą się nieruchomymi szwami.',
    fact:'U noworodka między kośćmi czaszki znajdują się ciemiączka — miękkie, błoniaste pola, dzięki którym główka może przejść przez kanał rodny. Zarastają całkowicie do ok. 2. roku życia.',
    joints:['zuchwa','szyjny']},
  'zuchwa': {name:'Żuchwa', latin:'Mandibula', region:'glowa', type:'Nieregularna', n:1, count:'1 kość', paired:false,
    desc:'Jedyna ruchoma kość czaszki. Łączy się z kośćmi skroniowymi stawem skroniowo-żuchwowym, umożliwiając żucie, mówienie i ziewanie. Jej część zębodołowa mieści dolny łuk zębowy — u dorosłego 16 zębów.',
    fact:'Mięsień żwacz, który unosi żuchwę, jest w stosunku do swojej wielkości jednym z najsilniejszych mięśni ciała — siła nacisku zębów trzonowych może przekraczać 700 N.',
    joints:['czaszka']},
  'szyjny': {name:'Kręgi szyjne', latin:'Vertebrae cervicales (C1–C7)', region:'kregoslup', type:'Nieregularne', n:7, count:'7 kręgów', paired:false,
    desc:'Najmniejsze i najbardziej ruchome kręgi. Dźwigają głowę i chronią rdzeń kręgowy. C1 — kręg szczytowy (atlas) — nie ma trzonu, a C2 — kręg obrotowy (axis) — ma ząb, wokół którego obraca się głowa. Otworami w wyrostkach poprzecznych biegną tętnice kręgowe.',
    fact:'Żyrafa ma dokładnie tyle samo kręgów szyjnych co człowiek — siedem. Różnią się wyłącznie rozmiarem: u żyrafy każdy może mieć ponad 25 cm długości.',
    joints:['czaszka','piersiowy']},
  'piersiowy': {name:'Kręgi piersiowe', latin:'Vertebrae thoracicae (Th1–Th12)', region:'kregoslup', type:'Nieregularne', n:12, count:'12 kręgów', paired:false,
    desc:'Łączą się z żebrami przez dołki żebrowe na trzonach i wyrostkach poprzecznych, tworząc tylną ścianę klatki piersiowej. Ich długie wyrostki kolczyste skierowane są skośnie w dół i nachodzą na siebie jak dachówki.',
    fact:'To najmniej ruchomy odcinek kręgosłupa — usztywnia go połączenie z żebrami. Dzięki temu skutecznie chroni serce i płuca.',
    joints:['szyjny','ledzwiowy','zebra-prawdziwe','zebra-rzekome','zebra-wolne']},
  'ledzwiowy': {name:'Kręgi lędźwiowe', latin:'Vertebrae lumbales (L1–L5)', region:'kregoslup', type:'Nieregularne', n:5, count:'5 kręgów', paired:false,
    desc:'Największe i najmasywniejsze kręgi — przenoszą ciężar całej górnej połowy ciała. Mają duże, nerkowate trzony i krótkie, grube wyrostki kolczyste. Tworzą fizjologiczną lordozę lędźwiową.',
    fact:'Rdzeń kręgowy kończy się zwykle na wysokości L1–L2, a niżej biegnie tzw. ogon koński. Dlatego nakłucie lędźwiowe wykonuje się bezpiecznie między L3 a L5.',
    joints:['piersiowy','krzyzowa']},
  'krzyzowa': {name:'Kość krzyżowa', latin:'Os sacrum', region:'kregoslup', type:'Nieregularna', n:1, count:'1 (5 zrośniętych kręgów)', paired:false,
    desc:'Powstaje ze zrośnięcia pięciu kręgów krzyżowych, zwykle między 16. a 30. rokiem życia. Wbita klinowo między kości miedniczne przenosi ciężar tułowia na kończyny dolne przez stawy krzyżowo-biodrowe.',
    fact:'Łacińska nazwa „os sacrum” oznacza „świętą kość”. Jedna z teorii mówi, że w starożytności właśnie tę kość składano w ofierze bogom.',
    joints:['ledzwiowy','guziczna','miedniczna']},
  'guziczna': {name:'Kość guziczna', latin:'Os coccygis', region:'kregoslup', type:'Nieregularna', n:1, count:'1 (3–5 zrośniętych kręgów)', paired:false,
    desc:'Szczątkowy „ogon” człowieka — zrośnięte, uwstecznione kręgi guziczne. Stanowi miejsce przyczepu mięśni i więzadeł dna miednicy oraz mięśnia pośladkowego wielkiego.',
    fact:'Nazwa pochodzi od greckiego „kokkyx” — kukułka, ponieważ kształt tej kości przypominał starożytnym dziób tego ptaka.',
    joints:['krzyzowa']},
  'mostek': {name:'Mostek', latin:'Sternum', region:'klatka', type:'Płaska', n:1, count:'1 kość', paired:false,
    desc:'Płaska kość przedniej ściany klatki piersiowej, złożona z rękojeści, trzonu i wyrostka mieczykowatego. Łączy się z obojczykami oraz chrząstkami żeber prawdziwych. Wewnątrz zawiera czerwony szpik kostny.',
    fact:'Mostek przez całe życie produkuje krwinki, dlatego jest jednym z miejsc, z których pobiera się szpik kostny do badań.',
    joints:['obojczyk','zebra-prawdziwe']},
  'zebra-prawdziwe': {name:'Żebra prawdziwe', latin:'Costae verae (I–VII)', region:'klatka', type:'Płaskie', n:14, count:'7 par (14)', paired:true,
    desc:'Pierwsze siedem par żeber łączy się bezpośrednio z mostkiem za pomocą własnych chrząstek żebrowych. Tworzą sprężysty kosz klatki piersiowej, który unosi się i opada przy każdym oddechu.',
    fact:'W ciągu całego życia klatka piersiowa wykonuje ok. 500–700 milionów oddechów — żebra pracują bez przerwy.',
    joints:['mostek','piersiowy','zebra-rzekome']},
  'zebra-rzekome': {name:'Żebra rzekome', latin:'Costae spuriae (VIII–X)', region:'klatka', type:'Płaskie', n:6, count:'3 pary (6)', paired:true,
    desc:'Pary VIII–X nie łączą się z mostkiem bezpośrednio — ich chrząstki przyczepiają się do chrząstki żebra leżącego powyżej, tworząc razem łuk żebrowy.',
    fact:'Łuk żebrowy łatwo wyczuć pod skórą. Wyznacza dolną granicę klatki piersiowej i jest ważnym punktem orientacyjnym podczas badania brzucha.',
    joints:['zebra-prawdziwe','zebra-wolne','piersiowy']},
  'zebra-wolne': {name:'Żebra wolne', latin:'Costae fluctuantes (XI–XII)', region:'klatka', type:'Płaskie', n:4, count:'2 pary (4)', paired:true,
    desc:'Najkrótsze żebra, których przednie końce kończą się swobodnie w mięśniach ściany brzucha — bez żadnego połączenia z mostkiem.',
    fact:'Liczba żeber bywa różna: część ludzi ma dodatkowe żebro szyjne lub lędźwiowe, a u innych brakuje dwunastej pary.',
    joints:['zebra-rzekome','piersiowy']},
  'obojczyk': {name:'Obojczyk', latin:'Clavicula', region:'gorna', type:'Długa', n:2, count:'2 kości', paired:true,
    desc:'Esowato wygięta kość łącząca mostek z łopatką — jedyne kostne połączenie kończyny górnej z tułowiem. Działa jak rozpórka, która utrzymuje ramię z dala od klatki piersiowej.',
    fact:'Obojczyk jako pierwsza kość zaczyna kostnieć w życiu płodowym (ok. 5.–6. tygodnia) i jako ostatnia kończy wzrost — około 25. roku życia.',
    joints:['mostek','lopatka']},
  'lopatka': {name:'Łopatka', latin:'Scapula', region:'gorna', type:'Płaska', n:2, count:'2 kości', paired:true,
    desc:'Trójkątna, płaska kość na tylnej ścianie klatki piersiowej. Jej panewka tworzy z głową kości ramiennej staw ramienny. Przyczepia się do niej 17 mięśni, w tym mięśnie stożka rotatorów.',
    fact:'Łopatka nie jest połączona stawem ani z kręgosłupem, ani z żebrami — „pływa” w mięśniach, co daje barkowi największy zakres ruchu w całym ciele.',
    joints:['obojczyk','ramienna']},
  'ramienna': {name:'Kość ramienna', latin:'Humerus', region:'gorna', type:'Długa', n:2, count:'2 kości', paired:true,
    desc:'Najdłuższa kość kończyny górnej. Jej głowa tworzy z łopatką staw ramienny, a dolny koniec łączy się z kością promieniową i łokciową w stawie łokciowym.',
    fact:'„Uderzenie w prąd” po stuknięciu łokciem to w rzeczywistości ucisk nerwu łokciowego, biegnącego tuż przy nadkłykciu przyśrodkowym kości ramiennej.',
    joints:['lopatka','promieniowa','lokciowa']},
  'promieniowa': {name:'Kość promieniowa', latin:'Radius', region:'gorna', type:'Długa', n:2, count:'2 kości', paired:true,
    desc:'Leży po stronie kciuka. Jej dolny koniec tworzy z kośćmi nadgarstka staw promieniowo-nadgarstkowy. Obraca się wokół kości łokciowej podczas nawracania i odwracania przedramienia.',
    fact:'Złamanie dalszej nasady kości promieniowej (złamanie Collesa) to jedno z najczęstszych złamań — zwykle skutek upadku na wyprostowaną rękę.',
    joints:['ramienna','lokciowa','nadgarstek']},
  'lokciowa': {name:'Kość łokciowa', latin:'Ulna', region:'gorna', type:'Długa', n:2, count:'2 kości', paired:true,
    desc:'Leży po stronie małego palca. Jej wyrostek łokciowy tworzy wyczuwalny „czubek” łokcia, a wcięcie bloczkowe obejmuje bloczek kości ramiennej, tworząc zawias stawu łokciowego.',
    fact:'Opierając łokcie na stole, opierasz się dokładnie na wyrostkach łokciowych tej kości.',

   ========================================================= */
const f = n => Math.round(n * 10) / 10;
const rr = (x,y,w,h,r) => `M${f(x+r)} ${f(y)}H${f(x+w-r)}Q${f(x+w)} ${f(y)} ${f(x+w)} ${f(y+r)}V${f(y+h-r)}Q${f(x+w)} ${f(y+h)} ${f(x+w-r)} ${f(y+h)}H${f(x+r)}Q${f(x)} ${f(y+h)} ${f(x)} ${f(y+h-r)}V${f(y+r)}Q${f(x)} ${f(y)} ${f(x+r)} ${f(y)}Z`;
const ell = (cx,cy,rx,ry=rx) => `M${f(cx-rx)} ${f(cy)}A${rx} ${ry} 0 1 0 ${f(cx+rx)} ${f(cy)}A${rx} ${ry} 0 1 0 ${f(cx-rx)} ${f(cy)}Z`;
// kość „długa” z poszerzonymi nasadami
function bp(x1,y1,x2,y2,w,e1,e2=e1){
  const dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy), ux=dx/L, uy=dy/L, nx=-uy, ny=ux;
  const P=(t,o)=>`${f(x1+ux*t+nx*o)} ${f(y1+uy*t+ny*o)}`;
  const r1=e1/2, r2=e2/2, s=w/2, a=Math.min(L*.38,r1*1.9), b=Math.min(L*.38,r2*1.9), k=1.3;
  return `M${P(0,r1)}C${P(a*.5,r1)} ${P(a*.5,s)} ${P(a,s)}L${P(L-b,s)}C${P(L-b*.5,s)} ${P(L-b*.5,r2)} ${P(L,r2)}`+
         `C${P(L+r2*k,r2)} ${P(L+r2*k,-r2)} ${P(L,-r2)}C${P(L-b*.5,-r2)} ${P(L-b*.5,-s)} ${P(L-b,-s)}`+
         `L${P(a,-s)}C${P(a*.5,-s)} ${P(a*.5,-r1)} ${P(0,-r1)}C${P(-r1*k,-r1)} ${P(-r1*k,r1)} ${P(0,r1)}Z`;
}
// promień: kolejne paliczki wzdłuż kierunku kości śródręcza/śródstopia
function ray(id, x1,y1,x2,y2, segs, w, e, gap=1.6){
  const L=Math.hypot(x2-x1,y2-y1), ux=(x2-x1)/L, uy=(y2-y1)/L;
  let x=x2+ux*(e/2+gap+e/2), y=y2+uy*(e/2+gap+e/2);
  segs.forEach((len,i)=>{
    const ee=e*(1-i*.12), ww=w*(1-i*.1);
    add(id, bp(x,y,x+ux*len,y+uy*len,ww,ee,ee*.92));
    x+=ux*(len+ee+gap); y+=uy*(len+ee+gap);
  });
}

   BUDOWA SVG
   ========================================================= */
const NS='http://www.w3.org/2000/svg';
const $ = s => document.querySelector(s);
const svg=$('#sk'), bonesG=$('#bones');
const MIRROR='matrix(-1 0 0 1 400 0)';
const groupOf = {};
function buildSVG(){
  let html='';
  for(const id of DRAW){
    if(id==='mostek'){
      html+='<g class="cart">'+[null,MIRROR].map(t=>`<g${t?` transform="${t}"`:''}>${CART.map(d=>`<path d="${d}"/>`).join('')}</g>`).join('')+'</g>';
    }
    const b=BONES[id], inst=CENTER.has(id)?[null]:[null,MIRROR];
    html+=`<g class="bone" data-bone="${id}" data-region="${b.region}" aria-label="${b.name}">`+
      inst.map((t,i)=>`<g class="inst" data-i="${i}"${t?` transform="${t}"`:''}>${SH[id].map(p=>`<path class="${p.c}"${p.sw?` style="stroke-width:${p.sw}"`:''} d="${p.d}"/>`).join('')}</g>`).join('')+'</g>';
  }
  bonesG.innerHTML=html;
  bonesG.querySelectorAll('.bone').forEach(g=>{
    groupOf[g.dataset.bone]=g;
    const bb=g.getBBox(); g.style.setProperty('--d', Math.round(80+bb.y*1.1)+'ms');
  });
  // gradienty regionów
  const defs=svg.querySelector('defs');
  REGIONS.forEach(r=>{
    const lg=document.createElementNS(NS,'linearGradient');
    lg.id='gR-'+r.id; lg.setAttribute('x1','0');lg.setAttribute('y1','0');lg.setAttribute('x2','1');lg.setAttribute('y2','1');
    lg.innerHTML=`<stop offset="0" style="stop-color:color-mix(in srgb,var(--r-${r.id}) 35%,#fff)"/><stop offset="1" style="stop-color:var(--r-${r.id})"/>`;
    defs.append(lg);
  });
  $('#app').classList.add('intro');
  setTimeout(()=>$('#app').classList.remove('intro'),2400);
}

const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function animateTo(t,ms=700){
  cancelAnimationFrame(anim); const s={...vb}, t0=performance.now();
  const step=now=>{ const k=Math.min(1,(now-t0)/ms), e=ease(k);
    setVB({x:s.x+(t.x-s.x)*e,y:s.y+(t.y-s.y)*e,w:s.w+(t.w-s.w)*e,h:s.h+(t.h-s.h)*e});
    if(k<1) anim=requestAnimationFrame(step); };
  anim=requestAnimationFrame(step);
}
function zoomToBone(id, inst=0){
  const g=groupOf[id]; if(!g) return;
  const ig=g.querySelectorAll('.inst')[inst]||g.querySelector('.inst');
  let bb=ig.getBBox();
  if(ig.getAttribute('transform')) bb={x:400-bb.x-bb.width,y:bb.y,width:bb.width,height:bb.height};
  const r=svg.getBoundingClientRect(), A=r.width/r.height;
  let w=Math.max(bb.width*2.1,130), h=Math.max(bb.height*1.5,150);
  if(w/h<A) w=h*A; else h=w/A;
  w=Math.min(w,BASE.w*1.05); h=Math.min(h,BASE.h*1.05);
  animateTo({x:bb.x+bb.width/2-w/2,y:bb.y+bb.height/2-h/2,w,h});
}
// w quizie i na wąskich ekranach zostawiamy miejsce na nakładki u góry sceny
const homeVB=()=>S.mode==='quiz'?{x:0,y:-120,w:400,h:1160}:innerWidth<=920?{x:0,y:-70,w:400,h:1110}:{...BASE};
const resetZoom=()=>animateTo(homeVB());
function zoomBy(k,cx,cy){
  const nw=Math.min(Math.max(vb.w*k,45),BASE.w*2.2); k=nw/vb.w;
  if(cx==null){cx=vb.x+vb.w/2;cy=vb.y+vb.h/2;}
  setVB({x:cx-(cx-vb.x)*k,y:cy-(cy-vb.y)*k,w:vb.w*k,h:vb.h*k});
}
function toSVG(cx,cy){ const p=svg.createSVGPoint(); p.x=cx;p.y=cy; return p.matrixTransform(svg.getScreenCTM().inverse()); }

const tip=$('#tip'), stage=$('#stage');
function boneAt(x,y){ const el=document.elementFromPoint(x,y); const g=el&&el.closest&&el.closest('.bone'); if(!g) return null; const ig=el.closest('.inst'); return {id:g.dataset.bone, inst:ig?+ig.dataset.i:0}; }
function setHover(id){
  if(S.hover===id) return;
  if(S.hover&&groupOf[S.hover]) groupOf[S.hover].classList.remove('hover');
  S.hover=id; if(id) groupOf[id].classList.add('hover');
}
function showTip(id,x,y){
  if(!id||S.mode==='quiz'){ tip.classList.remove('show'); return; }
  const b=BONES[id]; tip.querySelector('b').textContent=b.name; tip.querySelector('small').textContent=b.latin;
  const r=stage.getBoundingClientRect(); let tx=x-r.left+16, ty=y-r.top+16;
  const tw=tip.offsetWidth||180; if(tx+tw>r.width-8) tx=x-r.left-tw-12;
  tip.style.left=tx+'px'; tip.style.top=ty+'px'; tip.classList.add('show');
}
const pts=new Map(); let drag=null, pinch=null;
svg.addEventListener('pointerdown',e=>{
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1){ drag={x:e.clientX,y:e.clientY,vb:{...vb},moved:false,id:e.pointerId}; }
  if(pts.size===2){ const [a,b]=[...pts.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y),vb:{...vb}}; drag=null; }
});
svg.addEventListener('pointermove',e=>{
  if(pts.has(e.pointerId)) pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&pts.size===2){
    const [a,b]=[...pts.values()], d=Math.hypot(a.x-b.x,a.y-b.y), c=toSVG((a.x+b.x)/2,(a.y+b.y)/2);
    zoomBy((pinch.d/d)*(pinch.vb.w/vb.w),c.x,c.y); pinch.d=d; pinch.vb={...vb}; return;
  }
  if(drag&&drag.id===e.pointerId){
    const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    if(!drag.moved&&Math.hypot(dx,dy)>5){ drag.moved=true; svg.classList.add('dragging'); svg.setPointerCapture(e.pointerId); cancelAnimationFrame(anim); tip.classList.remove('show'); }
    if(drag.moved){ const s=svg.getScreenCTM().a; setVB({...drag.vb,x:drag.vb.x-dx/s,y:drag.vb.y-dy/s}); return; }
  }
  if(e.pointerType==='mouse'){ const h=boneAt(e.clientX,e.clientY); setHover(h&&h.id); showTip(h&&h.id,e.clientX,e.clientY); }
});
function endPtr(e){
  const wasDrag=drag&&drag.moved, wasPinch=!!pinch;
  pts.delete(e.pointerId);
  if(pts.size<2) pinch=null;
  if(drag&&drag.id===e.pointerId){
    svg.classList.remove('dragging');
    if(!wasDrag&&!wasPinch&&e.type==='pointerup'){
      const h=boneAt(e.clientX,e.clientY);
      if(S.mode==='quiz'){ if(h) quizAnswer(h.id,h.inst); }
      else if(h) select(h.id,{inst:h.inst}); else clearSel();
    }
    drag=null;
  }
}
svg.addEventListener('pointerup',endPtr); svg.addEventListener('pointercancel',endPtr);
svg.addEventListener('pointerleave',()=>{ if(!drag){ setHover(null); tip.classList.remove('show'); }});
svg.addEventListener('wheel',e=>{ e.preventDefault(); cancelAnimationFrame(anim); const p=toSVG(e.clientX,e.clientY); zoomBy(Math.exp(e.deltaY*.0015),p.x,p.y); },{passive:false});
$('#zIn').onclick=()=>animateTo(scaled(.7)); $('#zOut').onclick=()=>animateTo(scaled(1.4)); $('#zReset').onclick=resetZoom;
function scaled(k){ const nw=Math.min(Math.max(vb.w*k,45),BASE.w*2.2); k=nw/vb.w; const cx=vb.x+vb.w/2, cy=vb.y+vb.h/2; return {x:cx-vb.w*k/2,y:cy-vb.h*k/2,w:vb.w*k,h:vb.h*k}; }

function renderList(q=''){
  const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ł/g,'l');
  const nq=norm(q.trim()); let html='', hits=0;
  for(const r of REGIONS){
    const ids=ORDER_LIST.filter(id=>BONES[id].region===r.id&&(!nq||norm(BONES[id].name+' '+BONES[id].latin).includes(nq)));
    if(!ids.length) continue; hits+=ids.length;
    const total=ORDER_LIST.filter(id=>BONES[id].region===r.id).reduce((a,id)=>a+BONES[id].n,0);
    html+=`<div class="region"><div class="region-h" data-region="${r.id}" style="--rc:var(--r-${r.id})"><i></i>${r.name}<em>${total} kości</em></div>`+
      ids.map(id=>`<button class="item${S.sel===id?' on':''}" data-id="${id}"><span class="nm"><b>${esc(BONES[id].name)}</b><small>${esc(BONES[id].latin)}</small></span><span class="ct">${BONES[id].n}</span></button>`).join('')+'</div>';
  }
  if(!hits) html=`<div class="empty-search">Brak wyników dla „${esc(q)}”</div>`;
  html+=`<p class="note">Model pokazuje 199 kości. Pozostałe 7 to kosteczki słuchowe (3 pary: młoteczek, kowadełko, strzemiączko) oraz kość gnykowa.</p>`;
  list.innerHTML=html;
}

const Q={queue:[],i:0,score:0,streak:0,best:0,lock:false,len:10};
try{ Q.best=+localStorage.getItem('osteon-best')||0; }catch(_){}
function setMode(m){
  if(S.mode===m) return; S.mode=m;
  $('#mExplore').classList.toggle('on',m==='explore'); $('#mQuiz').classList.toggle('on',m==='quiz');
  $('#app').classList.toggle('quiz-on',m==='quiz');
  if(S.sel&&groupOf[S.sel]) groupOf[S.sel].classList.remove('sel');
  S.sel=null; svg.classList.remove('has-sel'); pill.classList.remove('show'); tip.classList.remove('show');
  document.querySelectorAll('.item.on').forEach(i=>i.classList.remove('on'));
  if(m==='quiz') quizStart(); else { $('#qcard').classList.remove('show'); $('#modal').classList.remove('show'); clearMarks(); renderWelcome(); resetZoom(); }
}
$('#mExplore').onclick=()=>setMode('explore'); $('#mQuiz').onclick=()=>setMode('quiz');
function clearMarks(){ document.querySelectorAll('.bone.ok,.bone.bad,.bone.hint').forEach(g=>g.classList.remove('ok','bad','hint')); }
function quizStart(){
  const pool=[...ORDER_LIST].sort(()=>Math.random()-.5);
  Q.queue=pool.slice(0,Q.len); Q.i=0; Q.score=0; Q.streak=0; Q.lock=false;
  $('#modal').classList.remove('show'); clearMarks(); resetZoom();
  detail.innerHTML=`<div class="qinfo"><h2>Quiz anatomiczny</h2><p>Na górze pojawi się nazwa kości — wskaż ją na szkielecie. Masz ${Q.len} pytań. Podpowiedzi z nazwami są w tym trybie wyłączone.</p>
    <div class="qstats"><div><small>Najlepszy wynik</small><b>${Q.best}/${Q.len}</b></div><div><small>Pytań w rundzie</small><b>${Q.len}</b></div></div>
    <p style="font-size:13px">Po każdej odpowiedzi zobaczysz tutaj opis kości — ucz się w trakcie gry.</p></div>`;
  $('#qcard').classList.add('show'); quizShow();
}
function quizShow(){
  const id=Q.queue[Q.i];
  $('#qnum').textContent=`Pytanie ${Q.i+1} / ${Q.len}`; $('#qname').textContent=BONES[id].name;
  $('#qscore').textContent=Q.score; $('#qstreak').textContent=Q.streak; $('#qbar').style.width=(Q.i/Q.len*100)+'%';
}
function quizAnswer(id,inst){
  if(Q.lock) return; Q.lock=true;
  const target=Q.queue[Q.i], ok=id===target;
  if(ok){ Q.score++; Q.streak++; groupOf[id].classList.add('ok'); }
  else { Q.streak=0; if(id) groupOf[id].classList.add('bad'); groupOf[target].classList.add('hint'); }
  $('#qscore').textContent=Q.score; $('#qstreak').textContent=Q.streak;
  const v=ok?`<div class="verdict ok">${IC.ok}Brawo! To ${BONES[target].name.toLowerCase()}.</div>`
            :`<div class="verdict bad">${IC.bad}${id?`To była ${esc(BONES[id].name.toLowerCase())}.`:'Pominięto.'} Poprawna odpowiedź podświetla się na żółto.</div>`;
  detail.innerHTML=boneHTML(target,v); detail.scrollTop=0;
  setTimeout(()=>{ clearMarks(); Q.i++; Q.lock=false; if(Q.i>=Q.len) quizEnd(); else quizShow(); }, ok?950:1900);
}
$('#qskip').onclick=()=>{ if(!Q.lock) quizAnswer(null); };
function quizEnd(){
  $('#qbar').style.width='100%';
  const pct=Q.score/Q.len, C=2*Math.PI*64, rec=Q.score>Q.best;
  if(rec){ Q.best=Q.score; try{ localStorage.setItem('osteon-best',Q.best);}catch(_){} }
  const msg=pct===1?['Perfekcyjnie!','Znasz szkielet jak profesor anatomii.']:pct>=.7?['Świetny wynik!','Jeszcze kilka kości i będzie komplet.']:pct>=.4?['Nieźle!','Warto jeszcze trochę poeksplorować.']:['Dobry początek','Przejdź do eksploracji i spróbuj ponownie.'];
  $('#mbox').innerHTML=`<div class="ring"><svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="64" fill="none" stroke="rgba(127,127,127,.18)" stroke-width="10"/><circle id="ringC" cx="75" cy="75" r="64" fill="none" stroke="url(#ringG)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" style="transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)"/><defs><linearGradient id="ringG"><stop offset="0" style="stop-color:var(--accent)"/><stop offset="1" style="stop-color:var(--accent-2)"/></linearGradient></defs></svg><b>${Q.score}<small>z ${Q.len}</small></b></div>
    <h2>${msg[0]}</h2><p>${msg[1]}${rec?'<br><b style="color:var(--accent)">Nowy rekord!</b>':''}</p>
    <div class="ctas"><button class="cta" id="again">${IC.play}Zagraj ponownie</button><button class="cta ghost" id="back">Eksploruj</button></div>`;
  $('#modal').classList.add('show');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ $('#ringC').style.strokeDashoffset=C*(1-pct); }));
  $('#again').onclick=quizStart; $('#back').onclick=()=>setMode('explore');
}

document.addEventListener('keydown',e=>{
  if(e.target.matches('input')){ if(e.key==='Escape') e.target.blur(); return; }
  if(e.key==='/'){ e.preventDefault(); $('#q').focus(); }
  else if(e.key==='Escape'){ if(S.mode==='explore') clearSel(); }
  else if(S.mode==='explore'&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){
    e.preventDefault(); const i=S.sel?ORDER_LIST.indexOf(S.sel):-1, d=e.key==='ArrowRight'?1:-1;
    select(ORDER_LIST[(i+d+ORDER_LIST.length)%ORDER_LIST.length]);
  }
  else if(e.key==='+'||e.key==='=') animateTo(scaled(.7));
  else if(e.key==='-') animateTo(scaled(1.4));
  else if(e.key==='0') resetZoom();
});

function countUp(){ const el=$('#countUp'), t0=performance.now(); const step=n=>{ const k=Math.min(1,(n-t0)/1400); el.textContent=Math.round(206*ease(k)); if(k<1) requestAnimationFrame(step); }; requestAnimationFrame(step); }

buildSVG(); setVB(homeVB()); renderList(); renderWelcome(); countUp();
const h=decodeURIComponent(location.hash.slice(1)); if(BONES[h]) setTimeout(()=>select(h),600);
window.addEventListener('hashchange',()=>{ const id=decodeURIComponent(location.hash.slice(1)); if(BONES[id]&&S.mode==='explore'&&id!==S.sel) select(id); });
})();
</script>
